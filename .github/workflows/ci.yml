name: CI
on: [push, pull_request]

env:
  # Cloudflare's documented always-passes test site key. The public build refuses to
  # produce dist/public without a site key, because a missing one silently disables the
  # Turnstile widget and makes every Contact Sales submission fail validation. Real
  # deployments must supply their own key; CI only needs the gate to be satisfiable.
  VITE_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA

# Supersede an in-flight run for the same ref on feature branches / PRs (faster iteration),
# but never cancel a run on dev — that one carries the deploy and must finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.13.0, not 22.12.0: eslint 9 and its ten @eslint/* packages declare
          # `^20.19.0 || ^22.13.0 || >=24`, so 22.12.0 fails `npm ci` with EBADENGINE before any
          # job body runs. 22.13.0 is the lowest release that satisfies every dependency in the
          # lockfile, and it still satisfies package.json's own `engines: >=22.12.0 <23`.
          node-version: '22.13.0'
          cache: npm
      # Before npm ci: this only needs the checkout, and a brand regression should be the
      # first thing the log shows rather than something found after a five-minute install.
      - name: Verify brand
        run: npm run verify:brand
      # `npm ci` enforces peer ranges strictly, unlike the `npm install` that produced the
      # committed lockfile. openapi-typescript@7 still declares `typescript: ^5.x` while this
      # project is on ~6.0.2, so plain `npm ci` failed ERESOLVE here before any job body ran —
      # on every push from the initial commit until 2026-08-22, which means the two e2e jobs
      # below (they need this one) had never executed at all. The `overrides` entry in
      # package.json resolves that peer to our own typescript; openapi-typescript 7.13.0 was
      # verified to generate correctly under 6.0.3. Removing the override breaks this step,
      # not a test.
      - run: npm ci
      - run: npm run verify:i18n
      - run: npm run build
      - run: npm test -- --run

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.13.0, not 22.12.0: eslint 9 and its ten @eslint/* packages declare
          # `^20.19.0 || ^22.13.0 || >=24`, so 22.12.0 fails `npm ci` with EBADENGINE before any
          # job body runs. 22.13.0 is the lowest release that satisfies every dependency in the
          # lockfile, and it still satisfies package.json's own `engines: >=22.12.0 <23`.
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      # webkit as well as chromium: `npm run test:e2e:public` below sets E2E_PUBLIC_ARTIFACT=true,
      # and playwright.config.ts switches to a chromium+webkit project matrix under that flag. With
      # chromium alone the public step cannot launch webkit at all. This never surfaced because the
      # job it lives in had never run -- `npm ci` failed ahead of it on every push until 2026-09-01.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Build web app for preview
        run: npm run build

      - name: Verify E2E tag integrity
        run: npm run verify:e2e-tags

      - name: Run UI-only E2E tests
        run: npm run test:e2e:ui-only:ci
        env:
          CI: true
          TEST_ENV: ci
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8080
          E2E_API_AVAILABLE: 'false'

      # The public-artifact suite is gated on E2E_PUBLIC_ARTIFACT and runs against the
      # static host on :4174, so it is invisible to the two greps above. Without this
      # step PUBLIC-VAL-003's real-HTTP-404 assertion and PUBLIC-VAL-011's
      # keyboard/reflow/reduced-motion/RTL checkpoints have no gate anywhere in CI.
      - name: Run public artifact E2E tests
        run: npm run test:e2e:public
        env:
          CI: true
          TEST_ENV: ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  e2e-with-api:
    name: E2E + API + OpenAPI contract
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: leaveo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout leaveo-web
        uses: actions/checkout@v4
        with:
          path: leaveo-web

      - name: Checkout leaveo-api
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/leaveo-api
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.LEAVEO_API_READ_TOKEN }}
          path: leaveo-api
        continue-on-error: false

      - uses: actions/setup-node@v4
        with:
          # 22.13.0, not 22.12.0: eslint 9 and its ten @eslint/* packages declare
          # `^20.19.0 || ^22.13.0 || >=24`, so 22.12.0 fails `npm ci` with EBADENGINE before any
          # job body runs. 22.13.0 is the lowest release that satisfies every dependency in the
          # lockfile, and it still satisfies package.json's own `engines: >=22.12.0 <23`.
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: leaveo-web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        working-directory: leaveo-web
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('leaveo-web/package-lock.json') }}
      - name: Install Playwright browsers
        working-directory: leaveo-web
        run: npx playwright install --with-deps chromium

      # The environment below mirrors leaveo-web/scripts/run-e2e-with-api.sh, which is the
      # documented way to run this suite and the source of truth for what the API needs.
      # Only the DB_* values differ (the MySQL service container above). Keep the two in
      # step: the first time this job ever reached the tests (2026-09-05, run 33969001876)
      # it failed billing-recovery on a missing STRIPE_WEBHOOK_SECRET that the script exports.
      - name: Start leaveo-api
        working-directory: leaveo-api
        env:
          SPRING_PROFILES_ACTIVE: dev
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: leaveo
          DB_USER: root
          DB_PASSWORD: root
          JWT_SECRET: ci-jwt-secret-must-be-at-least-32-characters
          CORS_ALLOWED_ORIGINS: http://localhost:5173
          PUBLIC_CORS_ALLOWED_ORIGINS: http://localhost:5173
          PLATFORM_CORS_ALLOWED_ORIGINS: http://localhost:5173
          LEAVEO_WEB_BASE_URL: http://localhost:5173
          PUBLIC_WEB_BASE_URL: http://localhost:5173
          PUBLIC_REGISTRATION_ENABLED: 'true'
          PAID_REGISTRATION_ENABLED: 'true'
          FREE_PROVISIONING_ENABLED: 'true'
          STRIPE_SIMULATED_PROVIDER: 'true'
          STRIPE_WEBHOOK_SECRET: whsec_e2e_local_secret
          STRIPE_PRICE_STARTER: price_e2e_starter
          STRIPE_PRICE_GROWTH: price_e2e_growth
          DEV_MAIL_SINK_ENABLED: 'true'
          LEAVEO_DEMO_RESET: 'true'
        run: |
          ./mvnw -B -q spring-boot:run \
            -Dspring-boot.run.jvmArguments="-Dspring.profiles.active=dev" &
          echo $! > api.pid

      - name: Wait for API health
        run: leaveo-web/scripts/wait-for-http.sh http://localhost:8080/actuator/health '"status":"UP"' 180

      - name: Verify OpenAPI generated types
        working-directory: leaveo-web
        env:
          API_URL: http://localhost:8080
        run: ./scripts/verify-openapi-types.sh

      - name: Build web app for preview
        working-directory: leaveo-web
        run: npm run build

      - name: Verify E2E tag integrity
        working-directory: leaveo-web
        run: npm run verify:e2e-tags

      - name: Run regression E2E with API
        working-directory: leaveo-web
        env:
          CI: true
          TEST_ENV: ci
          BASE_URL: http://localhost:5173
          API_URL: http://localhost:8080
          E2E_API_AVAILABLE: 'true'
          E2E_USER_EMAIL: alex@company.com
          E2E_USER_PASSWORD: PilotDev123!
          # tests/support/helpers/stripe-webhook.ts signs simulated webhooks with this; it
          # must equal the value the API was started with above.
          STRIPE_WEBHOOK_SECRET: whsec_e2e_local_secret
        run: npm run test:e2e:regression:ci

      - name: Stop leaveo-api
        if: always()
        working-directory: leaveo-api
        run: |
          if [[ -f api.pid ]]; then
            kill "$(cat api.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-with-api
          path: |
            leaveo-web/playwright-report/
            leaveo-web/test-results/
          retention-days: 7

  # Deploy to the test environment (test.leaveo.net / app-test.leaveo.net) only when all
  # three test jobs are green AND the commit landed ON dev. PRs to dev never reach here.
  deploy:
    name: Deploy to test env
    needs: [build, e2e, e2e-with-api]
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-test-web
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash ~/leaveo/bin/deploy-web.sh'
